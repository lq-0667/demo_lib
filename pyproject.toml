[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "demo_lib"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
    "mypy",
    "pre-commit"
]
[project.scripts]
demo-cli = "demo_lib.cli:main"

[tool.ruff]
line-length = 120

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
